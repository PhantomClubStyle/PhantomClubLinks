            align-items: center;
            min-height: 100vh;
            padding: 20px;
            position: relative;

        /* Capa oscura semitransparente para que el patrón sea sutil */
        body::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.96); /* Muy oscuro para efecto premium */
            z-index: -1;
        }

        .container {
            width: 100%;
            max-width: 420px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 1;
        }

        /* Logo Principal (Círculo) */
        .logo-container {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            overflow: hidden;
            border: 2px solid #ffffff;
            margin-bottom: 20px;
            background-color: #111;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .logo-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Textos de Perfil */
        .username {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .bio {
            font-size: 15px;
            color: #cccccc;
            margin-bottom: 25px;
            line-height: 1.4;
        }

        /* Iconos de Redes Superiores */
        .social-icons {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
        }

        .social-icons a {
            color: #ffffff;
            font-size: 24px;
            transition: opacity 0.2s ease;
        }

        .social-icons a:hover {
            opacity: 0.7;
        }

        /* Estilos de los Botones */
        .links-list {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .btn-link {
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: transparent;
            color: #ffffff;
            border: 2px solid #ffffff;
            border-radius: 50px;
            padding: 15px 20px;
            text-decoration: none;
            font-size: 16px;
            font-weight: 600;
            position: relative;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-link i {
            position: absolute;
            left: 25px;
            font-size: 20px;
        }

        .btn-link:hover {
            background-color: #ffffff;
            color: #000000;
        }

        <div class="username">Phantom Club</div>
        <div class="bio">
            Gorras Exclusivas y Limitadas<br>
            Envíos Nacionales Seguros<br>
            Contáctanos 👇
        </div>

        <!-- Iconos rápidos superiores -->

            </a>

            </a>
