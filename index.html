<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phantom Club - Enlaces</title>
    <!-- Importamos los iconos de FontAwesome para las redes -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 420px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Estilos del Logo */
        .logo-container {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            overflow: hidden;
            border: 2px solid #ffffff;
            margin-bottom: 20px;
            background-color: #111;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .logo-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Textos de Perfil */
        .username {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .bio {
            font-size: 15px;
            color: #cccccc;
            margin-bottom: 25px;
            line-height: 1.4;
        }

        /* Iconos de Redes Sociales Superiores */
        .social-icons {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
        }

        .social-icons a {
            color: #ffffff;
            font-size: 24px;
            transition: transform 0.2s ease;
        }

        .social-icons a:hover {
            transform: scale(1.1);
        }

        /* Estilos de los Botones Principales */
        .links-list {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .btn-link {
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #000000;
            color: #ffffff;
            border: 2px solid #ffffff;
            border-radius: 40px;
            padding: 15px 20px;
            text-decoration: none;
            font-size: 16px;
            font-weight: 600;
            position: relative;
            transition: background-color 0.2s ease, color 0.2s ease;
        }

        .btn-link i {
            position: absolute;
            left: 25px;
            font-size: 20px;
        }

        .btn-link:hover {
            background-color: #ffffff;
            color: #000000;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Logo -->
        <div class="logo-container">
            <!-- Reemplaza el enlace de la imagen por el de tu logo -->
            <img src="https://via.placeholder.com/110" alt="Logo de la Marca">
        </div>

        <!-- Usuario y Descripción -->
        <div class="username">@TuUsuario</div>
        <div class="bio">
            Gorras Exclusivas<br>
            Envíos Nacionales<br>
            Contacto 👇
        </div>

        <!-- Iconos rápidos superiores (Opcional) -->
        <div class="social-icons">
            <a href="https://tiktok.com/@tuusuario" target="_blank"><i class="fa-brands fa-tiktok"></i></a>
            <a href="https://wa.me/tuvariabledetelefono" target="_blank"><i class="fa-brands fa-whatsapp"></i></a>
            <a href="https://instagram.com/tuusuario" target="_blank"><i class="fa-brands fa-instagram"></i></a>
        </div>

        <!-- Botones de Enlaces -->
        <div class="links-list">
            <a href="https://wa.me/tuvariabledetelefono" class="btn-link" target="_blank">
                <i class="fa-brands fa-whatsapp"></i> WhatsApp
            </a>

            <a href="https://instagram.com/tuusuario" class="btn-link" target="_blank">
                <i class="fa-brands fa-instagram"></i> Instagram
            </a>

            <a href="https://tiktok.com/@tuusuario" class="btn-link" target="_blank">
                <i class="fa-brands fa-tiktok"></i> Tik Tok
            </a>

            <a href="https://phantomclubstyle.github.io/PhantomClub/#" class="btn-link" target="_blank">
                <i class="fa-solid fa-book-open"></i> Ver Catálogo
            </a>
        </div>
    </div>

</body>
</html>
