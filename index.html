<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Inventario - Gorras</title>
    <style>
        body {
            background-color: #121212;
            color: #e0e0e0;
            font-family: Arial, sans-serif;
            padding: 20px;
            margin: 0;
        }
        h2 { text-align: center; color: #fff; }
        .form-container, .stats-container {
            background: #1e1e1e;
            padding: 15px;
            border-radius: 8px;
            max-width: 500px;
            margin: 0 auto 20px auto;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .stats-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            text-align: center;
        }
        .stat-box {
            background: #252525;
            padding: 10px;
            border-radius: 6px;
        }
        .stat-box h3 { margin: 0; font-size: 15px; color: #4CAF50; }
        .stat-box p { margin: 5px 0 0; font-size: 11px; color: #aaa; }
        label { display: block; margin-top: 10px; font-size: 14px; color: #bbb; }
        input, select {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            background: #2a2a2a;
            border: 1px solid #333;
            color: #fff;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 12px;
            margin-top: 15px;
            background: #2e7d32;
            color: white;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
        }
        button:hover { background: #388e3c; }
        .table-container {
            max-width: 100%;
            overflow-x: auto;
            margin-top: 20px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            background: #1e1e1e;
            border-radius: 8px;
            overflow: hidden;
            font-size: 14px;
        }
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #2c2c2c;
        }
        th { background: #252525; color: #fff; }
        .btn-action {
            padding: 6px 10px;
            margin-right: 5px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            color: white;
        }
        .btn-sell { background: #f57c00; }
        .btn-sell:hover { background: #fb8c00; }
        .btn-delete { background: #d32f2f; }
        .btn-delete:hover { background: #e53935; }
        .ganancia-text { color: #4CAF50; font-weight: bold; }
    </style>
</head>
<body>

    <h2>Control de Inventario - Gorras</h2>

    <!-- Panel de Resumen con los dos apartados de dinero + stock -->
    <div class="stats-container">
        <div class="stat-box">
            <h3 id="totalVentasReal">0.00</h3>
            <p>Total Vendido</p>
        </div>
        <div class="stat-box">
            <h3 id="totalGananciaReal">0.00</h3>
            <p>Ganancias</p>
        </div>
        <div class="stat-box">
            <h3 id="totalGorras">0</h3>
            <p>En Stock</p>
        </div>
    </div>

    <!-- Formulario para agregar gorras -->
    <div class="form-container">
        <form id="inventoryForm">
            <label>Modelo / Nombre</label>
            <input type="text" id="nombre" placeholder="Ej: DandyHats Sadboys" required>

            <label>Stock / Cantidad</label>
            <input type="number" id="stock" value="1" min="1" required>

            <label>Costo de Compra (USDT)</label>
            <input type="number" id="costo" step="0.01" placeholder="23" required>

            <label>Precio de Venta (USDT)</label>
            <input type="number" id="usdtVenta" step="0.01" placeholder="38" required>

            <button type="submit">Agregar Gorra</button>
        </form>
    </div>

    <!-- Tabla de Inventario -->
    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>Stock</th>
                    <th>Modelo</th>
                    <th>Costo</th>
                    <th>Venta</th>
                    <th>Ganancia Unit.</th>
                    <th>Estado</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody id="tablaInventario">
                <!-- Los datos se cargan dinámicamente -->
            </tbody>
        </table>
    </div>

    <script>
        let inventario = JSON.parse(localStorage.getItem('inventario_gorras_v4')) || [];
        let totalVentasReal = parseFloat(localStorage.getItem('total_ventas_real')) || 0;
        let gananciaTotalReal = parseFloat(localStorage.getItem('ganancia_total_real_v4')) || 0;

        const form = document.getElementById('inventoryForm');
        const tabla = document.getElementById('tablaInventario');
        const totalVentasRealEl = document.getElementById('totalVentasReal');
        const totalGananciaRealEl = document.getElementById('totalGananciaReal');
        const totalGorrasEl = document.getElementById('totalGorras');

        function guardarTodo() {
            localStorage.setItem('inventario_gorras_v4', JSON.stringify(inventario));
            localStorage.setItem('total_ventas_real', totalVentasReal);
            localStorage.setItem('ganancia_total_real_v4', gananciaTotalReal);
            renderizar();
        }

        form.addEventListener('submit', function(e) {
            e.preventDefault();
            
            const costo = parseFloat(document.getElementById('costo').value);
            const usdtVenta = parseFloat(document.getElementById('usdtVenta').value);
            const gananciaUnitaria = usdtVenta - costo;

            const nuevaGorra = {
                id: Date.now(),
                nombre: document.getElementById('nombre').value,
                stock: parseInt(document.getElementById('stock').value),
                costo: costo,
                usdtVenta: usdtVenta,
                gananciaUnitaria: gananciaUnitaria,
                estado: 'En Stock'
            };

            inventario.push(nuevaGorra);
            form.reset();
            document.getElementById('stock').value = 1;
            guardarTodo();
        });

        function venderUnidad(id) {
            const item = inventario.find(g => g.id === id);
            if (item && item.stock > 0) {
                item.stock -= 1;
                
                // Sumar al total de ventas brutas el precio de venta de esta unidad
                totalVentasReal += item.usdtVenta;
                
                // Sumar a las ganancias netas la diferencia (Venta - Costo)
                gananciaTotalReal += item.gananciaUnitaria;

                if (item.stock === 0) {
                    item.estado = 'Agotado';
                }
                guardarTodo();
            }
        }

        function eliminarGorra(id) {
            inventario = inventario.filter(g => g.id !== id);
            guardarTodo();
        }

        function renderizar() {
            tabla.innerHTML = '';
            let sumaStock = 0;

            inventario.forEach(item => {
                sumaStock += item.stock;

                const fila = document.createElement('tr');
                fila.innerHTML = `
                    <td>${item.stock}</td>
                    <td><strong>${item.nombre}</strong></td>
                    <td>${item.costo}</td>
                    <td>${item.usdtVenta}</td>
                    <td class="ganancia-text">+${item.gananciaUnitaria.toFixed(2)}</td>
                    <td>${item.estado}</td>
                    <td>
                        <button class="btn-action btn-sell" onclick="venderUnidad(${item.id})">Vender 1</button>
                        <button class="btn-action btn-delete" onclick="eliminarGorra(${item.id})">Eliminar</button>
                    </td>
                `;
                tabla.appendChild(fila);
            });

            totalVentasRealEl.textContent = `${totalVentasReal.toFixed(2)} USDT`;
            totalGananciaRealEl.textContent = `${gananciaTotalReal.toFixed(2)} USDT`;
            totalGorrasEl.textContent = sumaStock;
        }

        renderizar();
    </script>
</body>
    </html>
