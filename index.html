<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Inventario Phantom Club</title>
    <style>
        body { font-family: sans-serif; background: #121212; color: #e0e0e0; padding: 20px; }
        .resumen { display: flex; gap: 20px; margin-bottom: 20px; }
        .card { background: #1e1e1e; padding: 15px; border-radius: 8px; flex: 1; text-align: center; }
        table { width: 100%; border-collapse: collapse; background: #1e1e1e; }
        th, td { padding: 12px; border: 1px solid #333; text-align: center; }
        button { background: #2e7d32; color: white; border: none; padding: 8px 12px; cursor: pointer; border-radius: 4px; }
        .btn-venta { background: #1976d2; }
    </style>
</head>
<body>

<h1>Control de Stock Phantom Club</h1>

<div class="resumen">
    <div class="card">Total Invertido: <span id="total-usdt">0</span> USDT</div>
    <div class="card">Stock Total: <span id="total-piezas">0</span> piezas</div>
</div>

<div class="card" style="margin-bottom: 20px;">
    <input type="text" id="modelo" placeholder="Modelo">
    <input type="number" id="cantidad" placeholder="Cantidad inicial" value="1">
    <input type="number" id="costo" placeholder="Costo Unitario (USDT)">
    <button onclick="agregarLote()">Agregar Lote</button>
</div>

<table>
    <thead>
        <tr>
            <th>Modelo</th>
            <th>Costo U.</th>
            <th>Inicial</th>
            <th>Vendidos</th>
            <th>Stock Actual</th>
            <th>Total Invertido</th>
            <th>Acción</th>
        </tr>
    </thead>
    <tbody id="tabla-cuerpo"></tbody>
</table>

<script>
    let inventario = JSON.parse(localStorage.getItem('inventario_gorras')) || [];

    function agregarLote() {
        const modelo = document.getElementById('modelo').value;
        const inicial = parseInt(document.getElementById('cantidad').value);
        const costo = parseFloat(document.getElementById('costo').value);

        if(!modelo || !inicial || !costo) return alert("Completa los datos");

        inventario.push({ id: Date.now(), modelo, inicial, vendidos: 0, costo });
        guardar();
    }

    function registrarVenta(id) {
        const item = inventario.find(i => i.id === id);
        if(item.vendidos < item.inicial) {
            item.vendidos++;
            guardar();
        } else {
            alert("No hay más stock");
        }
    }

    function guardar() {
        localStorage.setItem('inventario_gorras', JSON.stringify(inventario));
        renderizar();
    }

    function renderizar() {
        const cuerpo = document.getElementById('tabla-cuerpo');
        cuerpo.innerHTML = '';
        let totalUSDT = 0;
        let totalStock = 0;

        inventario.forEach(item => {
            const stockActual = item.inicial - item.vendidos;
            const inversionLote = item.inicial * item.costo;
            totalUSDT += inversionLote;
            totalStock += stockActual;

            cuerpo.innerHTML += `
                <tr>
                    <td>${item.modelo}</td>
                    <td>${item.costo}</td>
                    <td>${item.inicial}</td>
                    <td>${item.vendidos}</td>
                    <td>${stockActual}</td>
                    <td>${inversionLote} USDT</td>
                    <td><button class="btn-venta" onclick="registrarVenta(${item.id})">Vender 1</button></td>
                </tr>
            `;
        });
        document.getElementById('total-usdt').innerText = totalUSDT;
        document.getElementById('total-piezas').innerText = totalStock;
    }

    renderizar();
</script>
</body>
</html>
